services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: airflow
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/init-project.sql:/docker-entrypoint-initdb.d/init-project.sql:ro
    ports:
      - "127.0.0.1:55433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U airflow -d airflow"]
      interval: 10s
      timeout: 5s
      retries: 10

  project-init:
    build: .
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+psycopg2://airflow:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@postgres:5432/project
      PYTHONPATH: /opt/airflow/project
    volumes:
      - ./:/opt/airflow/project
    command: bash -c 'cd /opt/airflow/project && python -m pipeline.cli init'

  airflow-init:
    build: .
    depends_on:
      project-init:
        condition: service_completed_successfully
    environment: &airflow_env
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@postgres:5432/airflow
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
      AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: "true"
      DATABASE_URL: postgresql+psycopg2://airflow:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@postgres:5432/project
      AIRFLOW_ADMIN_PASSWORD: ${AIRFLOW_ADMIN_PASSWORD:?Set AIRFLOW_ADMIN_PASSWORD in .env}
      PYTHONPATH: /opt/airflow/project
    volumes: &airflow_volumes
      - ./:/opt/airflow/project
      - ./dags:/opt/airflow/dags:ro
      - airflow_logs:/opt/airflow/logs
    command: >
      bash -ec 'airflow db migrate;
      if ! airflow users list --output json | python -c "import json,sys; sys.exit(0 if any(u[\"username\"] == \"admin\" for u in json.load(sys.stdin)) else 1)"; then
      airflow users create --username admin --password "$$AIRFLOW_ADMIN_PASSWORD"
      --firstname Local --lastname Admin --role Admin --email admin@localhost.invalid;
      fi'

  airflow-webserver:
    build: .
    depends_on:
      airflow-init:
        condition: service_completed_successfully
    environment: *airflow_env
    volumes: *airflow_volumes
    ports:
      - "127.0.0.1:8089:8080"
    command: webserver

  airflow-scheduler:
    build: .
    depends_on:
      airflow-init:
        condition: service_completed_successfully
    environment: *airflow_env
    volumes: *airflow_volumes
    command: scheduler

  dashboard:
    build:
      context: .
      dockerfile: web/Dockerfile
    depends_on:
      project-init:
        condition: service_completed_successfully
    environment:
      DATABASE_URL: postgresql+psycopg2://airflow:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@postgres:5432/project
      WEB_HOST: 0.0.0.0
    ports:
      - "127.0.0.1:8091:8091"

volumes:
  pgdata:
  airflow_logs:
